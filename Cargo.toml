[package]
name = "qvec"
version = "0.1.0"
edition = "2024"
description = "A local semantic search index backed by SQLite"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fastembed = { version = "7.1", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
walkdir = "2"
